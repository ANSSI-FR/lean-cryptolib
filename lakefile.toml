name = "cryptolib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Cryptolib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

[[lean_lib]]
name = "Cryptolib"
